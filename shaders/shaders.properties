# Apa Adanya - Realism rebuild. Folder edition.
clouds=off
sun=false
moon=false
oldLighting=false
underwaterOverlay=false
vignette=false
separateAo=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
rain.depth=false
particles.ordering=mixed

# Screen Navigation
screen=<empty> <profile> <empty> [LIGHTING] [SHADOWS] [SKY] [WATER] [WORLD] [POST]
screen.columns=2

# Sub-screens
screen.LIGHTING=SSAO SSAO_SAMPLES SSGI GI_SAMPLES GI_STRENGTH VOLUMETRIC_LIGHT VL_SAMPLES NIGHT_BRIGHTNESS CAVE_BRIGHTNESS TORCH_BRIGHTNESS
screen.SHADOWS=SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_ALPHA_TEST CLOUD_SHADOWS sunPathRotation
screen.SKY=CLOUDS CLOUD_DETAIL CLOUD_STEPS CLOUD_COVERAGE CLOUD_ALTITUDE STARS SUN_MOON_GLOW FOG_ENABLED FOG_DENSITY
screen.WATER=WATER_REFRACTION WATER_CAUSTICS WATER_FOAM SSR SSR_STEPS WATER_OCTAVES WATER_WAVES WATER_CLARITY WATER_ROUGHNESS
screen.WORLD=WAVING_FOLIAGE WAVING_PLANTS WAVING_LEAVES WIND_SPEED RAIN_PUDDLES RESOURCE_NORMALS
screen.POST=BLOOM BLOOM_STRENGTH FXAA VIGNETTE VIGNETTE_STRENGTH TONEMAP_OPERATOR COLOR_SATURATION COLOR_CONTRAST EXPOSURE COLOR_DITHERING

# Continuous Sliders
sliders=COLOR_CONTRAST COLOR_SATURATION WATER_ROUGHNESS NIGHT_BRIGHTNESS EXPOSURE BLOOM_STRENGTH GI_STRENGTH WATER_WAVES WATER_CLARITY CLOUD_COVERAGE FOG_DENSITY CAVE_BRIGHTNESS TORCH_BRIGHTNESS VIGNETTE_STRENGTH WIND_SPEED CLOUD_ALTITUDE

