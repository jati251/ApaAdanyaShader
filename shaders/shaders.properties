iris.features.optional=CUSTOM_IMAGES COMPUTE_SHADERS SEPARATE_HARDWARE_SAMPLERS
clouds=off
sun=false
moon=false
oldLighting=false
underwaterOverlay=false
vignette=false
separateAo=true
shadowTranslucent=false
blend.shadow=off
shadowEntities=true
shadowBlockEntities=true
rain.depth=false
particles.ordering=mixed

# Fine cloud noise: one hardware trilinear lookup replaces eight corner hashes.
# Macro weather and coverage remain procedural. GPU allocation: 512 KiB.
#if CLOUDS == 2
customTexture.aaCloudNoise=textures/cloud_noise.bin TEXTURE_3D R16F 64 64 64 RED FLOAT
#endif

# Generated grayscale focus mask; bilinear/clamp settings live beside the PNG.
#ifdef WATER_CAUSTICS
customTexture.aaWaterCaustics=textures/water_caustics_v1.png
#endif

screen=<profile> [LIGHTING] [SHADOWS] [SKY] [WATER] [INDIRECT] [WORLD] [PARTICLES] [POST] [PERFORMANCE]
screen.columns=2
screen.LIGHTING=ATMOSPHERIC_LIGHTING SSAO SSAO_SAMPLES VOLUMETRIC_LIGHT VL_SAMPLES NIGHT_BRIGHTNESS CAVE_BRIGHTNESS TORCH_BRIGHTNESS
screen.SHADOWS=SHADOWS CONTACT_HARDENING_SHADOWS HARDWARE_PCF shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_ALPHA_TEST CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH sunPathRotation
screen.SKY=CLOUDS CLOUD_LAYERS CLOUD_LIGHT_SAMPLES CLOUD_DETAIL CLOUD_STEPS CLOUD_COVERAGE CLOUD_ALTITUDE STARS SUN_MOON_GLOW FOG_ENABLED FOG_DENSITY
screen.WATER=WATER_REFRACTION WATER_CAUSTICS WATER_OCTAVES WATER_WAVES WATER_CLARITY WATER_ROUGHNESS SSR SSR_STEPS
screen.INDIRECT=SSGI GI_SAMPLES GI_RADIUS GI_TRACE_STEPS GI_DISTANCE GI_STRENGTH LIGHT_SPACE_FALLBACK TEMPORAL_INDIRECT SVGF_DENOISER
screen.WORLD=WAVING_FOLIAGE WAVING_PLANTS WAVING_LEAVES WIND_SPEED RAIN_PUDDLES MATERIAL_FILTER RESOURCE_NORMALS RESOURCE_SPECULAR SPECULAR_AA POM POM_STEPS POM_DEPTH POM_DISTANCE
screen.PARTICLES=PARTICLE_LIGHTING SOFT_PARTICLES PARTICLE_SOFTNESS WEATHER_OPACITY
screen.POST=TONEMAP_OPERATOR COLOR_SATURATION COLOR_VIBRANCE COLOR_CONTRAST EXPOSURE AUTO_EXPOSURE COLOR_TEMPERATURE COLOR_TINT BLOOM BLOOM_STRENGTH TAA TAA_BLEND FXAA MOTION_BLUR COLOR_DITHERING
screen.PERFORMANCE=UPSCALE_QUALITY UPSCALE_SHARPNESS CLOUD_RECONSTRUCTION CLOUD_FULL_RES TEMPORAL_CLOUDS HALF_RES_LIGHTING DEPTH_HIERARCHY
sliders=CLOUD_SHADOW_STRENGTH COLOR_CONTRAST COLOR_SATURATION COLOR_VIBRANCE COLOR_TEMPERATURE COLOR_TINT WATER_ROUGHNESS NIGHT_BRIGHTNESS EXPOSURE BLOOM_STRENGTH GI_STRENGTH GI_RADIUS GI_DISTANCE WATER_WAVES WATER_CLARITY CLOUD_COVERAGE FOG_DENSITY CAVE_BRIGHTNESS TORCH_BRIGHTNESS WIND_SPEED CLOUD_ALTITUDE PARTICLE_SOFTNESS WEATHER_OPACITY POM_DEPTH POM_DISTANCE TAA_BLEND

