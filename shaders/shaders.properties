profile.HIGH=ATMOSPHERIC_LIGHTING AUTO_EXPOSURE BLOOM BLOOM_STRENGTH:0.02 CAVE_BRIGHTNESS:1.0 CLOUDS:2 CLOUD_ALTITUDE:360.0 CLOUD_COVERAGE:0.48 CLOUD_DETAIL !CLOUD_FULL_RES CLOUD_LAYERS:3 CLOUD_LIGHT_SAMPLES:4 CLOUD_RECONSTRUCTION CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH:0.75 CLOUD_STEPS:20 COLOR_CONTRAST:1.0 COLOR_DITHERING COLOR_SATURATION:1.0 COLOR_TEMPERATURE:0.0 COLOR_TINT:0.0 COLOR_VIBRANCE:0.0 CONTACT_HARDENING_SHADOWS DEPTH_HIERARCHY EXPOSURE:1.0 FOG_DENSITY:0.65 FOG_ENABLED !FXAA GI_DISTANCE:64.0 GI_RADIUS:8.0 GI_SAMPLES:2 GI_STRENGTH:0.65 GI_TRACE_STEPS:24 HALF_RES_LIGHTING HARDWARE_PCF LIGHT_SPACE_FALLBACK MATERIAL_FILTER:4 MOTION_BLUR NIGHT_BRIGHTNESS:1.0 PARTICLE_LIGHTING PARTICLE_SOFTNESS:0.35 !POM POM_DEPTH:0.25 POM_DISTANCE:24.0 POM_STEPS:16 RAIN_PUDDLES RESOURCE_NORMALS RESOURCE_SPECULAR SHADOWS SHADOW_ALPHA_TEST SHADOW_SAMPLES:8 SOFT_PARTICLES SPECULAR_AA SSAO SSAO_SAMPLES:4 SSGI SSR SSR_STEPS:24 STARS SUN_MOON_GLOW SVGF_DENOISER TAA TAA_BLEND:0.80 TEMPORAL_CLOUDS TEMPORAL_INDIRECT TONEMAP_OPERATOR:2 TORCH_BRIGHTNESS:1.0 VL_SAMPLES:6 VOLUMETRIC_LIGHT WATER_CAUSTICS WATER_CLARITY:1.0 WATER_OCTAVES:6 WATER_REFRACTION WATER_ROUGHNESS:0.10 WATER_WAVES:0.65 WAVING_FOLIAGE WAVING_LEAVES WAVING_PLANTS WEATHER_OPACITY:0.65 WIND_SPEED:1.0 shadowDistance:144.0 shadowMapResolution:2048 sunPathRotation:-25.0 UPSCALE_QUALITY:1 UPSCALE_SHARPNESS:0.20
