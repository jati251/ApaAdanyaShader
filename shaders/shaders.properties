#ifdef SHADOWS
shadow.enabled=true
#else
shadow.enabled=false
#endif
program.shadow.enabled=SHADOWS
#if CLOUDS > 0
program.prepare1.enabled=CLOUD_SHADOWS
#else
program.prepare1.enabled=false
#endif
program.composite2.enabled=BLOOM
program.composite3.enabled=BLOOM
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false
program.world-1/prepare1.enabled=false
program.world1/prepare1.enabled=false
program.world-1/composite2.enabled=BLOOM
program.world1/composite2.enabled=BLOOM
program.world-1/composite3.enabled=BLOOM
program.world1/composite3.enabled=BLOOM

#ifdef BLOOM
size.buffer.colortex4=0.25 0.25
size.buffer.colortex5=0.25 0.25
#else
size.buffer.colortex4=1 1
size.buffer.colortex5=1 1
#endif
#if (((defined(SSAO) || defined(SSGI)) || defined(SSR)) || defined(RESOURCE_SPECULAR))
size.buffer.colortex1=1.0 1.0
size.buffer.colortex15=1.0 1.0
#else
size.buffer.colortex1=1 1
size.buffer.colortex15=1 1
#endif
#ifdef RESOURCE_SPECULAR
size.buffer.colortex3=1.0 1.0
#else
size.buffer.colortex3=1 1
#endif
#ifdef TAA
size.buffer.colortex13=1.0 1.0
#else
size.buffer.colortex13=1 1
#endif
size.buffer.colortex7=128 64
#if CLOUDS == 1
size.buffer.colortex8=128 128
#else
size.buffer.colortex8=256 256
#endif
colortex13Clear=false
blend.gbuffers_terrain=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_hand.colortex3=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.dh_terrain=off
blend.dh_water=off
dhShadow.enabled=false

# Depth hierarchy precedes clouds/history/indirect; denoising precedes composition.
#if (CLOUDS == 2 && defined(CLOUD_RECONSTRUCTION))
program.deferred1.enabled=true
program.deferred2.enabled=TEMPORAL_CLOUDS
#ifdef CLOUD_FULL_RES
size.buffer.colortex9=1.0 1.0
#else
size.buffer.colortex9=0.5 0.5
#endif
#ifdef TEMPORAL_CLOUDS
#ifdef CLOUD_FULL_RES
size.buffer.colortex10=1.0 1.0
size.buffer.colortex11=1.0 1.0
#else
size.buffer.colortex10=0.5 0.5
size.buffer.colortex11=0.5 0.5
#endif
#else
size.buffer.colortex10=1 1
size.buffer.colortex11=1 1
#endif
#else
program.deferred1.enabled=false
program.deferred2.enabled=false
size.buffer.colortex9=1 1
size.buffer.colortex10=1 1
size.buffer.colortex11=1 1
#endif
program.world-1/deferred1.enabled=false
program.world1/deferred1.enabled=false
program.world-1/deferred2.enabled=false
program.world1/deferred2.enabled=false
#if (defined(HALF_RES_LIGHTING) && (defined(SSAO) || defined(SSGI)))
program.deferred3.enabled=true
program.world-1/deferred3.enabled=true
program.world1/deferred3.enabled=true
#else
program.deferred3.enabled=false
program.world-1/deferred3.enabled=false
program.world1/deferred3.enabled=false
#endif
# Indirect lighting is consumed before volumetric shafts reuse this allocation.
#if ((defined(HALF_RES_LIGHTING) && (defined(SSAO) || defined(SSGI))) || ((defined(HALF_RES_LIGHTING) && defined(VOLUMETRIC_LIGHT)) && defined(SHADOWS)))
size.buffer.colortex12=0.5 0.5
#else
size.buffer.colortex12=1 1
#endif

# The final deferred pass keeps the original full-resolution scene lighting,
# sampling whichever reduced-resolution results were produced above.
program.deferred5.enabled=true
program.world-1/deferred5.enabled=true
program.world1/deferred5.enabled=true
program.composite6.enabled=true
program.world-1/composite6.enabled=true
program.world1/composite6.enabled=true

program.composite4.enabled=BLOOM
program.world-1/composite4.enabled=BLOOM
program.world1/composite4.enabled=BLOOM


#if UPSCALE_QUALITY > 0
program.composite7.enabled=true
program.world-1/composite7.enabled=true
program.world1/composite7.enabled=true
program.composite8.enabled=true
program.world-1/composite8.enabled=true
program.world1/composite8.enabled=true
size.buffer.colortex14=1.0 1.0
#else
program.composite7.enabled=false
program.world-1/composite7.enabled=false
program.world1/composite7.enabled=false
program.composite8.enabled=false
program.world-1/composite8.enabled=false
program.world1/composite8.enabled=false
size.buffer.colortex14=1 1
#endif

# Material response attachment is written without alpha blending.
blend.gbuffers_entities.colortex15=off
blend.gbuffers_hand.colortex15=off
blend.gbuffers_textured.colortex15=off
blend.gbuffers_textured_lit.colortex15=off
blend.gbuffers_terrain.colortex15=off
blend.gbuffers_particles.colortex15=off

# Iris 1.10.5+ exposes colortex16; meter opaque HDR after lighting, before display.
program.deferred6.enabled=AUTO_EXPOSURE
program.world-1/deferred6.enabled=AUTO_EXPOSURE
program.world1/deferred6.enabled=AUTO_EXPOSURE
size.buffer.colortex16=1 1
colortex16Clear=false

# Separate GI/AO history survives the later composite passes.
#if ((defined(TEMPORAL_INDIRECT) && defined(HALF_RES_LIGHTING)) && (defined(SSAO) || defined(SSGI)))
size.buffer.colortex17=0.5 0.5
size.buffer.colortex18=0.5 0.5
#else
size.buffer.colortex17=1 1
size.buffer.colortex18=1 1
#endif
colortex17Clear=false
colortex18Clear=false

# Depth acceleration and GI denoising are optional; the fallback uses GLSL 330.
#if (defined(IRIS_FEATURE_CUSTOM_IMAGES) && defined(IRIS_FEATURE_COMPUTE_SHADERS))
#ifdef DEPTH_HIERARCHY
program.deferred.enabled=true
program.world-1/deferred.enabled=true
program.world1/deferred.enabled=true
image.aaHiZImage=aaHiZ rg rg32f float false true 1.0 0.5
uniform.bool.aaHiZReady=1 == 1
#else
uniform.bool.aaHiZReady=1 == 0
program.deferred.enabled=false
program.world-1/deferred.enabled=false
program.world1/deferred.enabled=false
#endif
#if (((defined(SVGF_DENOISER) && defined(HALF_RES_LIGHTING)) && defined(TEMPORAL_INDIRECT)) && defined(SSGI))
image.aaDenoiseImageA=aaDenoiseA rgba rgba16f float false true 0.5 0.5
image.aaDenoiseImageB=aaDenoiseB rgba rgba16f float false true 0.5 0.5
uniform.bool.aaDenoiseReady=1 == 1
program.deferred4.enabled=true
program.deferred4_a.enabled=true
program.deferred4_b.enabled=true
program.world-1/deferred4.enabled=true
program.world-1/deferred4_a.enabled=true
program.world-1/deferred4_b.enabled=true
program.world1/deferred4.enabled=true
program.world1/deferred4_a.enabled=true
program.world1/deferred4_b.enabled=true
size.buffer.colortex19=0.5 0.5
colortex19Clear=false
#else
uniform.bool.aaDenoiseReady=1 == 0
program.deferred4.enabled=false
program.deferred4_a.enabled=false
program.deferred4_b.enabled=false
program.world-1/deferred4.enabled=false
program.world-1/deferred4_a.enabled=false
program.world-1/deferred4_b.enabled=false
program.world1/deferred4.enabled=false
program.world1/deferred4_a.enabled=false
program.world1/deferred4_b.enabled=false
size.buffer.colortex19=1 1
#endif
#else
uniform.bool.aaHiZReady=1 == 0
program.deferred.enabled=false
program.world-1/deferred.enabled=false
program.world1/deferred.enabled=false
uniform.bool.aaDenoiseReady=1 == 0
program.deferred4.enabled=false
program.deferred4_a.enabled=false
program.deferred4_b.enabled=false
program.world-1/deferred4.enabled=false
program.world-1/deferred4_a.enabled=false
program.world-1/deferred4_b.enabled=false
program.world1/deferred4.enabled=false
program.world1/deferred4_a.enabled=false
program.world1/deferred4_b.enabled=false
size.buffer.colortex19=1 1
#endif

# Reuse indirect scratch after deferred has consumed GI.
#if ((defined(VOLUMETRIC_LIGHT) && defined(HALF_RES_LIGHTING)) && defined(SHADOWS))
uniform.bool.aaVLReady=1 == 1
#else
uniform.bool.aaVLReady=1 == 0
#endif
#if ((defined(VOLUMETRIC_LIGHT) && defined(HALF_RES_LIGHTING)) && defined(SHADOWS))
program.composite.enabled=true
#else
program.composite.enabled=false
#endif
program.world-1/composite.enabled=false
program.world1/composite.enabled=false


