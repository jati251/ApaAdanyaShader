clouds=off
sun=false
moon=false
oldLighting=false
underwaterOverlay=false
vignette=false
separateAo=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
rain.depth=false
particles.ordering=mixed

screen=<profile> [LIGHTING] [SHADOWS] [SKY] [WATER] [WORLD] [PARTICLES] [POST] [CAMERA] [PERFORMANCE]
screen.columns=2
screen.LIGHTING=SSAO SSAO_SAMPLES SSGI GI_SAMPLES GI_STRENGTH VOLUMETRIC_LIGHT VL_SAMPLES NIGHT_BRIGHTNESS CAVE_BRIGHTNESS TORCH_BRIGHTNESS
screen.SHADOWS=SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_ALPHA_TEST CLOUD_SHADOWS sunPathRotation
screen.SKY=CLOUDS CLOUD_DETAIL CLOUD_STEPS CLOUD_COVERAGE CLOUD_ALTITUDE STARS SUN_MOON_GLOW FOG_ENABLED FOG_DENSITY
screen.WATER=WATER_REFRACTION WATER_CAUSTICS WATER_FOAM SSR SSR_STEPS WATER_OCTAVES WATER_WAVES WATER_CLARITY WATER_ROUGHNESS
screen.WORLD=WAVING_FOLIAGE WAVING_PLANTS WAVING_LEAVES WIND_SPEED RAIN_PUDDLES RESOURCE_NORMALS RESOURCE_SPECULAR SPECULAR_AA POM POM_STEPS POM_DEPTH POM_DISTANCE
screen.PARTICLES=PARTICLE_LIGHTING SOFT_PARTICLES PARTICLE_SOFTNESS WEATHER_OPACITY
screen.POST=COLOR_PROFILE TONEMAP_OPERATOR COLOR_SATURATION COLOR_VIBRANCE COLOR_CONTRAST EXPOSURE COLOR_TEMPERATURE COLOR_TINT BLOOM BLOOM_STRENGTH TAA TAA_BLEND TAA_SHARPENING TAA_SHARPEN_STRENGTH FXAA VIGNETTE VIGNETTE_STRENGTH CHROMATIC_ABERRATION CA_STRENGTH FILM_GRAIN FILM_GRAIN_STRENGTH COLOR_DITHERING
screen.PERFORMANCE=UPSCALE_QUALITY UPSCALE_SHARPNESS CLOUD_RECONSTRUCTION TEMPORAL_CLOUDS HALF_RES_LIGHTING HALF_RES_DOF
screen.CAMERA=MOTION_BLUR MOTION_BLUR_LOW_LATENCY MOTION_BLUR_STRENGTH MOTION_BLUR_SAMPLES MOTION_BLUR_HAND DOF DOF_AUTOFOCUS DOF_FOCUS_DISTANCE DOF_FOCAL_LENGTH DOF_FSTOP DOF_SAMPLES DOF_MAX_RADIUS
sliders=COLOR_CONTRAST COLOR_SATURATION COLOR_VIBRANCE COLOR_TEMPERATURE COLOR_TINT WATER_ROUGHNESS NIGHT_BRIGHTNESS EXPOSURE BLOOM_STRENGTH GI_STRENGTH WATER_WAVES WATER_CLARITY CLOUD_COVERAGE FOG_DENSITY CAVE_BRIGHTNESS TORCH_BRIGHTNESS VIGNETTE_STRENGTH WIND_SPEED CLOUD_ALTITUDE DOF_FOCUS_DISTANCE DOF_FOCAL_LENGTH DOF_FSTOP DOF_MAX_RADIUS MOTION_BLUR_STRENGTH CA_STRENGTH FILM_GRAIN_STRENGTH PARTICLE_SOFTNESS WEATHER_OPACITY POM_DEPTH POM_DISTANCE TAA_BLEND TAA_SHARPEN_STRENGTH

# Complete base: switching down resets expensive options from previous profiles.
profile.POTATO=UPSCALE_QUALITY:0 UPSCALE_SHARPNESS:0.40 !SHADOWS !SSAO !SSR !SSGI CLOUDS:0 !CLOUD_DETAIL !VOLUMETRIC_LIGHT !BLOOM !TAA TAA_BLEND:0.80 !TAA_SHARPENING TAA_SHARPEN_STRENGTH:0.40 !FXAA !WAVING_FOLIAGE !WAVING_PLANTS !WAVING_LEAVES !CLOUD_SHADOWS SHADOW_ALPHA_TEST !WATER_REFRACTION !WATER_CAUSTICS !WATER_FOAM !RAIN_PUDDLES !VIGNETTE COLOR_DITHERING STARS SUN_MOON_GLOW FOG_ENABLED !RESOURCE_NORMALS !RESOURCE_SPECULAR !SPECULAR_AA !SOFT_PARTICLES !PARTICLE_LIGHTING !DOF !HALF_RES_DOF DOF_AUTOFOCUS DOF_SAMPLES:8 DOF_MAX_RADIUS:6.0 DOF_FSTOP:2.8 DOF_FOCAL_LENGTH:50.0 DOF_FOCUS_DISTANCE:8.0 !MOTION_BLUR !MOTION_BLUR_LOW_LATENCY MOTION_BLUR_STRENGTH:0.50 MOTION_BLUR_SAMPLES:4 !MOTION_BLUR_HAND COLOR_PROFILE:0 COLOR_VIBRANCE:0.0 COLOR_TEMPERATURE:0.0 COLOR_TINT:0.0 !CHROMATIC_ABERRATION CA_STRENGTH:1.0 !FILM_GRAIN FILM_GRAIN_STRENGTH:0.03 PARTICLE_SOFTNESS:0.35 WEATHER_OPACITY:0.65 WATER_OCTAVES:2 SHADOW_SAMPLES:1 shadowMapResolution:256 shadowDistance:48.0 SSAO_SAMPLES:4 GI_SAMPLES:2 GI_STRENGTH:0.45 VL_SAMPLES:4 SSR_STEPS:8 CLOUD_STEPS:6 FOG_DENSITY:0.65 CAVE_BRIGHTNESS:1.0 COLOR_CONTRAST:1.04 COLOR_SATURATION:1.05 EXPOSURE:1.0 NIGHT_BRIGHTNESS:1.5 TORCH_BRIGHTNESS:1.0 sunPathRotation:-25.0 CLOUD_COVERAGE:0.48 CLOUD_ALTITUDE:360.0 WATER_WAVES:0.65 WATER_CLARITY:1.0 WATER_ROUGHNESS:0.14 WIND_SPEED:1.0 BLOOM_STRENGTH:0.08 VIGNETTE_STRENGTH:0.15 TONEMAP_OPERATOR:0 !POM POM_STEPS:8 POM_DEPTH:0.25 POM_DISTANCE:16.0 !CLOUD_RECONSTRUCTION !TEMPORAL_CLOUDS !HALF_RES_LIGHTING
profile.LOW=profile.POTATO SHADOWS FXAA !TAA CLOUDS:1 WAVING_FOLIAGE WAVING_PLANTS WAVING_LEAVES SPECULAR_AA SOFT_PARTICLES WATER_OCTAVES:3 shadowMapResolution:512 shadowDistance:64.0 SHADOW_SAMPLES:2 FOG_DENSITY:0.80 VIGNETTE VIGNETTE_STRENGTH:0.20 !SSAO !SSGI !SSR !VOLUMETRIC_LIGHT !BLOOM !DOF !MOTION_BLUR !FILM_GRAIN
profile.MEDIUM=profile.LOW CLOUDS:2 CLOUD_DETAIL CLOUD_RECONSTRUCTION TEMPORAL_CLOUDS CLOUD_STEPS:10 CLOUD_SHADOWS SSAO SSAO_SAMPLES:6 HALF_RES_LIGHTING SSR SSR_STEPS:16 WATER_REFRACTION WATER_CAUSTICS WATER_FOAM RAIN_PUDDLES WATER_OCTAVES:4 PARTICLE_LIGHTING TAA TAA_BLEND:0.75 TAA_SHARPENING TAA_SHARPEN_STRENGTH:0.35 FXAA BLOOM BLOOM_STRENGTH:0.06 VIGNETTE VIGNETTE_STRENGTH:0.25 shadowMapResolution:1024 shadowDistance:96.0 SHADOW_SAMPLES:4 FOG_DENSITY:1.0 !SSGI !VOLUMETRIC_LIGHT !DOF !HALF_RES_DOF !MOTION_BLUR !FILM_GRAIN !RESOURCE_NORMALS !RESOURCE_SPECULAR !POM
profile.HIGH=profile.MEDIUM SSGI GI_SAMPLES:3 GI_STRENGTH:0.45 VOLUMETRIC_LIGHT VL_SAMPLES:8 RESOURCE_NORMALS RESOURCE_SPECULAR POM POM_STEPS:16 POM_DISTANCE:24.0 SSR_STEPS:28 SSAO_SAMPLES:8 CLOUD_STEPS:16 SHADOW_SAMPLES:6 shadowMapResolution:2048 shadowDistance:144.0 WATER_OCTAVES:5 TAA_BLEND:0.80 TAA_SHARPEN_STRENGTH:0.40 BLOOM_STRENGTH:0.08 VIGNETTE_STRENGTH:0.30 !DOF !HALF_RES_DOF !MOTION_BLUR !FILM_GRAIN
profile.ULTRA=profile.HIGH HALF_RES_LIGHTING SSR_STEPS:40 GI_SAMPLES:5 GI_STRENGTH:0.50 SSAO_SAMPLES:12 CLOUD_STEPS:22 VL_SAMPLES:12 SHADOW_SAMPLES:8 WATER_OCTAVES:6 shadowDistance:176.0 POM_STEPS:24 POM_DISTANCE:32.0 TAA_BLEND:0.85 TAA_SHARPEN_STRENGTH:0.45 !DOF !HALF_RES_DOF !MOTION_BLUR !FILM_GRAIN
profile.EXTREME=profile.ULTRA !HALF_RES_LIGHTING SSR_STEPS:56 GI_SAMPLES:6 GI_STRENGTH:0.55 VL_SAMPLES:16 CLOUD_STEPS:28 shadowMapResolution:4096 shadowDistance:224.0 WATER_OCTAVES:7 POM_STEPS:32 POM_DISTANCE:48.0 DOF HALF_RES_DOF DOF_AUTOFOCUS DOF_SAMPLES:20 DOF_MAX_RADIUS:10.0 DOF_FSTOP:2.8 MOTION_BLUR MOTION_BLUR_SAMPLES:12 MOTION_BLUR_STRENGTH:0.40 !MOTION_BLUR_HAND FILM_GRAIN FILM_GRAIN_STRENGTH:0.02

#ifdef SHADOWS
shadow.enabled=true
#else
shadow.enabled=false
#endif
program.shadow.enabled=SHADOWS
#if CLOUDS == 2
program.prepare1.enabled=CLOUD_SHADOWS
#else
program.prepare1.enabled=false
#endif
program.composite1.enabled=BLOOM
program.composite2.enabled=BLOOM
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false
program.world-1/prepare1.enabled=false
program.world1/prepare1.enabled=false
program.world-1/composite1.enabled=BLOOM
program.world1/composite1.enabled=BLOOM
program.world-1/composite2.enabled=BLOOM
program.world1/composite2.enabled=BLOOM

size.buffer.colortex4=0.25 0.25
size.buffer.colortex5=0.25 0.25
size.buffer.colortex7=128 64
size.buffer.colortex8=128 128
colortex13Clear=false
blend.gbuffers_terrain=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_hand.colortex3=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.dh_terrain=off
blend.dh_water=off
dhShadow.enabled=false

# Full scene composition follows three optional reduced-resolution passes.
#if CLOUDS == 2 && defined(CLOUD_RECONSTRUCTION)
program.deferred.enabled=true
program.deferred1.enabled=TEMPORAL_CLOUDS
size.buffer.colortex9=0.5 0.5
#ifdef TEMPORAL_CLOUDS
size.buffer.colortex10=0.5 0.5
size.buffer.colortex11=0.5 0.5
#else
size.buffer.colortex10=1 1
size.buffer.colortex11=1 1
#endif
#else
program.deferred.enabled=false
program.deferred1.enabled=false
size.buffer.colortex9=1 1
size.buffer.colortex10=1 1
size.buffer.colortex11=1 1
#endif
program.world-1/deferred.enabled=false
program.world1/deferred.enabled=false
program.world-1/deferred1.enabled=false
program.world1/deferred1.enabled=false
#if defined(HALF_RES_LIGHTING) && (defined(SSAO) || defined(SSGI))
program.deferred2.enabled=true
program.world-1/deferred2.enabled=true
program.world1/deferred2.enabled=true
#else
program.deferred2.enabled=false
program.world-1/deferred2.enabled=false
program.world1/deferred2.enabled=false
#endif
#if defined(HALF_RES_DOF) && defined(DOF)
program.composite4.enabled=true
program.world-1/composite4.enabled=true
program.world1/composite4.enabled=true
#else
program.composite4.enabled=false
program.world-1/composite4.enabled=false
program.world1/composite4.enabled=false
#endif
# Lighting has been consumed before the lens pass reuses this allocation.
#if (defined(HALF_RES_LIGHTING) && (defined(SSAO) || defined(SSGI))) || (defined(HALF_RES_DOF) && defined(DOF))
size.buffer.colortex12=0.5 0.5
#else
size.buffer.colortex12=1 1
#endif

# The final deferred pass keeps the original full-resolution scene lighting,
# sampling whichever reduced-resolution results were produced above.
program.deferred3.enabled=true
program.world-1/deferred3.enabled=true
program.world1/deferred3.enabled=true
program.composite5.enabled=true
program.world-1/composite5.enabled=true
program.world1/composite5.enabled=true

program.composite3.enabled=BLOOM
program.world-1/composite3.enabled=BLOOM
program.world1/composite3.enabled=BLOOM

#if UPSCALE_QUALITY > 0
program.composite6.enabled=true
program.world-1/composite6.enabled=true
program.world1/composite6.enabled=true
program.composite7.enabled=true
program.world-1/composite7.enabled=true
program.world1/composite7.enabled=true
size.buffer.colortex14=1.0 1.0
#else
program.composite6.enabled=false
program.world-1/composite6.enabled=false
program.world1/composite6.enabled=false
program.composite7.enabled=false
program.world-1/composite7.enabled=false
program.world1/composite7.enabled=false
size.buffer.colortex14=1 1
#endif
